<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1e543f"><title>Gastito de Blas</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body><main class="app-shell"><header class="topbar"><div><p class="eyebrow">MI PLATA, CLARA</p><h1>Gastito de Blas</h1></div><div class="saved"><i></i>Guardado</div></header><nav class="period-tabs"><button data-period="day">Día</button><button data-period="week" class="selected">Semana</button><button data-period="month">Mes</button></nav><section class="hero-card"><p id="hero-label">Gastaste esta semana</p><strong id="hero-total">$0</strong><span id="expense-count">0 gastos registrados</span><div id="day-meter" class="day-meter"></div></section><section class="summary-section"><p class="eyebrow">RESUMEN</p><div class="summary-heading"><h2>En qué se fue</h2><b id="period-total">$0</b></div><div id="category-summary" class="category-summary"></div></section><section class="card add-card"><div class="section-heading"><h2>Registrar gasto</h2><span>en un minuto</span></div><form id="expense-form"><label class="amount-label"><span>¿Cuánto gastaste?</span><div class="amount-input"><b>$</b><input id="amount" inputmode="decimal" type="number" min="0.01" step="0.01" placeholder="0" required></div></label><div class="two-columns"><label>Categoría<select id="category" required></select></label><label>Fecha<input id="date" type="date" required></label></div><label>Comentario <em>opcional</em><input id="comment" maxlength="100" placeholder="Ej.: almuerzo con compañeros"></label><button type="submit">Guardar gasto</button></form></section><section class="card budget-card"><div class="section-heading"><div><h2>Límite semanal</h2><span id="limit-status">Sin límite definido</span></div><button class="text-button" id="budget-toggle" type="button">Definir</button></div><div id="budget-editor" hidden><label>Máximo semanal<div class="amount-input"><b>$</b><input id="budget-input" inputmode="decimal" type="number" min="0" step="0.01"></div></label><button id="save-budget" type="button">Guardar límite</button></div><div class="progress-track"><i id="budget-progress"></i></div></section><section class="card export-card"><div><h2>Respaldo de gastos</h2><p>Descargá todos los gastos en una planilla.</p></div><button id="export-data" type="button">Descargar CSV</button></section><section class="recent-section"><div class="section-heading"><h2>Últimos gastos</h2><select id="filter-category"></select></div><div id="expenses-list" class="expenses-list"></div></section></main><template id="expense-template"><article class="expense"><div class="category-icon"></div><div class="expense-main"><strong></strong><small></small></div><b></b><button class="delete" type="button">×</button></article></template><script src="app.js"></script><script src="export.js"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js')</script></body></html>
